[project]
name = "crank-pilot"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pyright==1.1.414",
    "vulture==2.16",
    "complexipy==9.0.0",
]

[tool.ruff]
target-version = "py311"
extend-include = ["bin/crank-pilot"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pyright]
include = ["pilot", "bin/crank-pilot", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.vulture]
min_confidence = 90
paths = ["pilot", "bin/crank-pilot", "tests"]

[tool.complexipy]
paths = ["pilot", "bin/crank-pilot", "tests"]
max-complexity-allowed = 15
